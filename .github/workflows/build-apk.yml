name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dipendenze
        run: npm install

      - name: Prepara cartella www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Aggiungi piattaforma Android (solo se non esiste)
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configura firma release nel build.gradle (automatico, nessun progetto locale richiesto)
        run: python3 scripts/patch-android-signing.py

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Carica APK debug come artifact
        uses: actions/upload-artifact@v4
        with:
          name: manutenzioni-antifurto-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Release firmata: gira solo se i secrets sono presenti nel repo ---
      # Nota: il contesto "secrets" non è utilizzabile direttamente dentro "if:",
      # quindi il controllo viene fatto qui in uno step separato che salva un output.
      - name: Verifica presenza secrets di firma
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Lunghezza KEYSTORE_BASE64 ricevuta: ${#KEYSTORE_BASE64} caratteri"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decodifica keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build APK release firmato
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Carica APK release come artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manutenzioni-antifurto-release
          path: android/app/build/outputs/apk/release/app-release.apk
