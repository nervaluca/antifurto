name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dipendenze
        run: npm install

      - name: Prepara cartella www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Aggiungi piattaforma Android (solo se non esiste)
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: manutenzioni-antifurto-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
